<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#08090b" />
  <!-- Neon Tech Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#grad)" stroke-width="2.5" opacity="0.9" />
  <!-- Terminal Prompt / Futuristic Code Monogram -->
  <path d="M18 20 L32 32 L18 44" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="36" y1="44" x2="48" y2="44" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  <!-- Live Pulse Dot -->
  <circle cx="48" cy="16" r="3.5" fill="#10b981" filter="url(#glow)" />
</svg>
